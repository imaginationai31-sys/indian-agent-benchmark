<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indian Agent Benchmark — Simulator</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
  <header><h1>Indian Agent Benchmark</h1><span>Simulator v0.1</span></header>
  <main>
    <section class="task-panel">
      <label>Benchmark task <select id="taskSelect"></select></label>
      <p id="taskText"></p>
      <button id="resetBtn">Reset task</button>
    </section>

    <section class="controls">
      <input id="search" placeholder="Search products…" aria-label="Search products">
      <select id="category"><option value="">All categories</option><option>laptop</option><option>smartphone</option><option>audio</option><option>monitor</option></select>
      <input id="maxPrice" type="number" min="0" placeholder="Max price ₹">
      <select id="sort"><option value="relevance">Sort: relevance</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select>
    </section>

    <section class="layout">
      <div><div id="products" class="grid"></div></div>
      <aside><h2>Action trajectory</h2><ol id="actions"></ol><div id="selected">No product selected</div><label class="check"><input id="verified" type="checkbox"> Verified final details</label><button id="evaluate">Run evaluation</button><div id="score"></div></aside>
    </section>
  </main>
  <script src="/frontend/app.js"></script>
</body>
</html>
